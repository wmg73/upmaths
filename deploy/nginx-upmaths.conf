# upmaths.com nginx 配置
# 规范：唯一入口 https://upmaths.com，www 与 http 全部 301 到主域
# 修改记录：2026-10-23 修复 http://www 返回 200 的重复内容问题；证书扩展覆盖 www
# 备份：/root/upmaths.conf.bak.20261023-093515

# ---------- 80：全部 301 到 https 主域，保留 ACME 验证通道 ----------
server {
    listen 80;
    server_name upmaths.com www.upmaths.com;

    # Let's Encrypt http-01 验证必须走这里，不能被 301 吃掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://upmaths.com$request_uri;
    }
}

# ---------- 443 www：只做 301，不反代，避免生成重复内容 ----------
server {
    listen 443 ssl;
    server_name www.upmaths.com;

    ssl_certificate /etc/letsencrypt/live/upmaths.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upmaths.com/privkey.pem;

    return 301 https://upmaths.com$request_uri;
}

# ---------- 443 主域：正式站点 ----------
server {
    listen 443 ssl;
    server_name upmaths.com;
    access_log /var/log/nginx/upmaths.access.log combined;

    ssl_certificate /etc/letsencrypt/live/upmaths.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upmaths.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 验证文件：静态直出，绕开 Next 的 locale 中间件 ----------
    # 这些路径不能被 next-intl 的 307 /en/ 前缀重定向吃掉，
    # 否则搜索引擎验证失败、IndexNow 校验返回 403
    location = /BingSiteAuth.xml {
        root /var/www/upmaths/public;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /baidu_verify_codeva-LmjkJeqSzs.html {
        root /var/www/upmaths/public;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /65701801cff6d08de55f4789969ac741.txt {
        root /var/www/upmaths/public;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    # ads.txt 同理（AdSense 抓取时也要求裸路径 200）
    location = /ads.txt {
        root /var/www/upmaths/public;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- robots / sitemap：长缓存，释放抓取预算 ----------
    # Next.js 默认 max-age=0, must-revalidate，导致 Googlebot 每次访问都重拉 robots.txt
    # 实测 7 天 119 次（占抓取量 40%）。这两个文件一天变不了几次，给缓存即可。
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缺这一行会导致 next-intl 的 307 跳转 Location 变成 https://localhost:3001/...
        proxy_set_header X-Forwarded-Host $host;
    }
}
